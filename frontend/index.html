<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高中化学交互式 Wiki</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('chem-wiki.appearance')
          const mode = saved === 'dark' || saved === 'system' || saved === 'light' ? saved : 'light'
          document.documentElement.dataset.theme = mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'system' ? 'light' : mode
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
