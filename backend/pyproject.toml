[project]
name = "chem-wiki-backend"
version = "0.1.0"
description = "FastAPI backend for chem-wiki"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL",
    "live: requires explicit opt-in and access to an external service",
]

[tool.ruff]
target-version = "py313"
line-length = 100
